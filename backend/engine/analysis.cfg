# KataGo analysis engine config for luciaGo
# Tuned for fast interactive analysis on an NVIDIA 4070 Ti Super (OpenCL).
# maxVisits can be overridden per-request from the backend for higher quality.

logDir = kataGo/logs

# Analysis engine concurrent-position workers.
numAnalysisThreads = 2

# Per-position search threads — plenty on this GPU, keeps latency low.
numSearchThreads = 4

# GPU batching: 1 GPU * nnMaxBatchSize >= numSearchThreads * numAnalysisThreads (8).
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 21

# Report winrates as BLACK perspective (0..1) consistently.
reportAnalysisWinratesAs = BLACK

# Length of the principal variation to report per move.
analysisPVLen = 10

# Avoid over-spreading search across the whole board (better move quality).
wideRootNoise = 0.02

# Default visit budget; the backend overrides this per request.
maxVisits = 300
